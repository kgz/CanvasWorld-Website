schema: spec-driven

context: |
  # CanvasWorld — OpenSpec project context

  ## Repository
  - GitHub: `kgz/CanvasWorld-Website`
  - Default branch: `master`
  - Monorepo: `packages/backend` (Go/Fiber), `packages/frontend` (React/Vite)

  ## AI delivery loop (required)
  Full step-by-step: `.cursor/rules/canvasworld-workflow.mdc`

  1. **Ticket** — GitHub issue on [Project #6](https://github.com/users/kgz/projects/6/views/1); `./bin/board-status.sh in-progress <issue>`
  2. **Branch** — `feature/<issue>-<slug>` from `master`
  3. **Spec** — `/opsx:propose` on `master` → `openspec/changes/<change-name>/`
  4. **Explore / apply** — `/opsx:explore` (optional), `/opsx:apply` on feature branch
  5. **Test & quality** — `go build` in `packages/backend`; `pnpm run build` in `packages/frontend` when UI changes
  6. **PR** — link `Closes #N` to ticket(s)
  7. **Archive spec** — `openspec archive <change-name> -y`
  8. **Merge** — after review
  9. **Done** — close issue, board Done, delete branch

  ## Git branch policy
  - **Propose** (`/opsx:propose`): on `master`
  - **Apply** (`/opsx:apply`, `/opsx:archive`): on `feature/<n>-<slug>` for that change

  Preflight:
  ```bash
  git branch --show-current
  git status -sb
  ```

  ## GitHub Project #6
  https://github.com/users/kgz/projects/6/views/1 — Backlog → Ready → In progress → In review → Done

  ## Stack
  - Backend: Go (Fiber) in `packages/backend/` — MySQL via GORM, bot SSR for social embeds, screenshot service
  - Frontend: React 18 + TypeScript + Vite in `packages/frontend/` — Three.js / R3F attractors & maps, GLSL shaders, leva/dat-gui controls
  - Package manager: pnpm (frontend); Go modules (backend)
  - Dev: Air for Go hot reload; Vite for frontend; docker-compose for MySQL + services
  - Open Design: `design/canvasworld-prototype/` (imported folder) — `./bin/od-import-project.sh`, `./bin/od-design-run.sh`

  Key domains:
  - Mathematical attractors and maps (Clifford, Hopalong, Mandelbrot, etc.)
  - WebGL/Three.js visualization with parameter controls
  - Hybrid SSR/SPA for Discord/social meta tags
  - Route registry served by backend for attractor pages

  Conventions:
  - TypeScript: no `any`, no `as` casts
  - PHP not used here; Go 1.x / modern TS
  - Minimal diffs; match existing patterns
  - Comments only for non-obvious logic

rules:
  proposal:
    - Run git branch preflight. New change: must be on `master`.
  specs:
    - Run git branch preflight. Must be on delivery branch for active change.
  design:
    - Run git branch preflight. Must be on delivery branch for active change.
  tasks:
    - Run git branch preflight. Must be on delivery branch for active change.
